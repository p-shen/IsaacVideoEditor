name: Release downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate without publishing
        type: choice
        default: all
        options: [all, macos, linux, windows]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name || format('validation-{0}', github.run_number) }}
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  SDL_AUDIODRIVER: dummy

jobs:
  macos:
    name: macOS Apple silicon
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: brew install cmake pkgconf qt mlt ffmpeg
      - name: Build
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build-release --target IsaacVideoEditor --parallel 3
      - name: Package
        run: python3 packaging/package-macos.py build-release dist "$VERSION"
      - name: Check extracted download
        run: |
          mkdir -p "$RUNNER_TEMP/package check"
          ditto -x -k dist/*.zip "$RUNNER_TEMP/package check"
          ISAAC_CLEAN_RUNTIME=1 python3 tests/package_smoke_test.py \
            "$RUNNER_TEMP/package check/IsaacVideoEditor.app/Contents/MacOS/IsaacVideoEditor"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: macos-download
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  linux:
    name: Linux x64
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libmlt-dev libmlt++-dev \
            libmlt-data ffmpeg libgl1-mesa-dev libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: qtimageformats
          cache: false
      - name: Install packaging tools and Qt notices
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-tools" "$RUNNER_TEMP/qt-notices"
          cd "$RUNNER_TEMP/deploy-tools"
          curl --fail --location --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy.AppImage' | sha256sum --check
          curl --fail --location --retry 3 -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt.AppImage' | sha256sum --check
          chmod +x ./*.AppImage
          echo "$RUNNER_TEMP/deploy-tools" >> "$GITHUB_PATH"
          echo "LINUXDEPLOY=$RUNNER_TEMP/deploy-tools/linuxdeploy.AppImage" >> "$GITHUB_ENV"
          echo "QMAKE=$QT_ROOT_DIR/bin/qmake" >> "$GITHUB_ENV"
          echo "QT_LICENSE_DIR=$RUNNER_TEMP/qt-notices" >> "$GITHUB_ENV"
          for component in qtbase qtdeclarative qtsvg qtimageformats; do
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch v6.8.3 \
              "https://github.com/qt/$component.git" "$RUNNER_TEMP/qt-notices/$component"
            git -C "$RUNNER_TEMP/qt-notices/$component" sparse-checkout set LICENSES
            rm -rf "$RUNNER_TEMP/qt-notices/$component/.git"
          done
      - name: Build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release --target IsaacVideoEditor --parallel 4
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash packaging/package-linux.sh build-release dist "$VERSION"
      - name: Check AppImage download
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ISAAC_CLEAN_RUNTIME: '1'
        run: python3 tests/package_smoke_test.py dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: linux-download
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    name: Windows x64
    if: github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-mlt
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-libxml2
      - name: Build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH=/ucrt64
          cmake --build build-release --target IsaacVideoEditor --parallel 4
      - name: Package
        run: bash packaging/package-windows.sh build-release dist "$VERSION"
      - name: Check extracted download
        run: |
          mkdir -p "$RUNNER_TEMP/package check"
          python -m zipfile -e dist/*.zip "$RUNNER_TEMP/package check"
          ISAAC_CLEAN_RUNTIME=1 python tests/package_smoke_test.py \
            "$RUNNER_TEMP/package check/IsaacVideoEditor/IsaacVideoEditor.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: windows-download
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Attach release downloads
    if: github.event_name == 'release'
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-download'
          merge-multiple: true
          path: dist
      - name: Upload packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum ./*.zip ./*.AppImage > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*.zip ./*.AppImage SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary CI downloads
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_IDS: ${{ needs.macos.outputs.artifact }} ${{ needs.linux.outputs.artifact }} ${{ needs.windows.outputs.artifact }}
        run: |
          for artifact in $ARTIFACT_IDS; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          done
