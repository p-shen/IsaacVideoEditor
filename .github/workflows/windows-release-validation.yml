name: Validate existing Windows download
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing windows-download
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      SDL_AUDIODRIVER: dummy
      ISAAC_REQUIRE_SUBTITLE_RUNTIME: '1'
      ISAAC_CLEAN_RUNTIME: '1'
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download built packages
        shell: pwsh
        run: gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name windows-download --dir dist
      - name: Check portable app with native Windows Python
        shell: pwsh
        run: |
          python -m zipfile -e (Get-Item dist/*.zip).FullName "$env:RUNNER_TEMP/package check"
          python tests/package_smoke_test.py "$env:RUNNER_TEMP/package check/IsaacVideoEditor/IsaacVideoEditor.exe"
      - name: Check installed app
        shell: pwsh
        run: python tests/windows_installer_smoke_test.py (Get-Item dist/*-Setup.exe).FullName (Get-Item dist/*.zip).FullName
      - name: Capture extended runtime diagnostic on failure
        if: failure()
        shell: pwsh
        run: |
          @'
          import os, subprocess
          from pathlib import Path
          app=Path(os.environ['RUNNER_TEMP'])/'package check/IsaacVideoEditor/IsaacVideoEditor.exe'
          env={**os.environ,'PATH':str(Path(os.environ['SYSTEMROOT'])/'System32'),'QT_FORCE_STDERR_LOGGING':'1'}
          try:
              result=subprocess.run([str(app),'--smoke-test',str(Path('tests/fixtures/seek.mp4').resolve())],env=env,capture_output=True,text=True,timeout=150)
              print('Extended diagnostic exit:',result.returncode)
              print(result.stdout+result.stderr)
          except subprocess.TimeoutExpired as error:
              print('Extended diagnostic timed out')
              for output in (error.stdout,error.stderr):
                  if output: print(output.decode(errors='replace') if isinstance(output,bytes) else output)
              raise
          '@ | python
